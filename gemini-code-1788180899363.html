<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Santolaya Distribuciones PRO</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel para interpretar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-900 selection:bg-blue-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const PHONE_NUMBER = "2622246306";

    const INITIAL_PRODUCTS = [
      { id: 's1', name: 'Red Point Box', price: 16400, category: 'Cigarrillos' },
      { id: 's2', name: 'Máster ks', price: 12500, category: 'Cigarrillos' },
      { id: 's3', name: 'Red Point On', price: 17630, category: 'Cigarrillos' },
      { id: 's4', name: 'Milenio Click Box', price: 19650, category: 'Cigarrillos' },
      { id: 's5', name: 'Alfajor Fulbito surtido', price: 8050, category: 'Alfajores' },
      { id: 's6', name: 'Alfajor Guaymallén (Oro/Plata)', price: 12560, category: 'Alfajores' },
      { id: 's7', name: 'Alfajor Rasta (Caja x 18 unid.)', price: 1099, category: 'Alfajores' },
      { id: 's8', name: 'Alfajor Genio', price: 7180, category: 'Alfajores' },
      { id: 's9', name: 'Papas Ketchup Don Justo', price: 8720, category: 'Snacks' },
      { id: 's10', name: 'Papas Fritas Rick\'s', price: 7660, category: 'Snacks' },
      { id: 's11', name: 'Bizcochos 9 de Oro', price: 1250, category: 'Galletas' },
      { id: 's12', name: 'Don Satur Saladas', price: 1150, category: 'Galletas' },
      { id: 's13', name: 'Baggio Pronto 1L', price: 365, category: 'Almacén' },
      { id: 's14', name: 'Encendedor Maxi Bic', price: 10090, category: 'Kiosco' },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('catalog');
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [customers, setCustomers] = useState([
        { id: 'c1', name: 'Kiosco El Sol', address: 'Av. San Martín 1234' },
        { id: 'c2', name: 'Despensa Doña Rosa', address: 'Belgrano 456' }
      ]);
      const [cart, setCart] = useState([]);
      const [selectedCustomer, setSelectedCustomer] = useState(null);
      const [orders, setOrders] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, products, cart, orders]);

      const updateQuantity = (product, delta) => {
        const existing = cart.find(i => i.product.id === product.id);
        if (existing) {
          const newQty = existing.quantity + delta;
          if (newQty <= 0) setCart(cart.filter(i => i.product.id !== product.id));
          else setCart(cart.map(i => i.product.id === product.id ? {...i, quantity: newQty} : i));
        } else if (delta > 0) {
          setCart([...cart, { product, quantity: delta }]);
        }
      };

      const cartTotal = useMemo(() => cart.reduce((t, i) => t + (i.product.price * i.quantity), 0), [cart]);

      const sendWhatsAppOrder = (order) => {
        const itemsList = order.items.map(i => `• ${i.product.name} x${i.quantity} ($${(i.product.price * i.quantity).toLocaleString('es-AR')})`).join('\n');
        const message = `*SANTOLAYA DISTRIBUCIONES - PEDIDO*\n\n` +
          `👤 *Cliente:* ${order.customer?.name || 'Venta Mostrador'}\n` +
          `📍 *Dirección:* ${order.customer?.address || 'N/A'}\n` +
          `🕒 *Hora:* ${order.date}\n\n` +
          `📋 *Detalle del Pedido:*\n${itemsList}\n\n` +
          `💰 *TOTAL:* $${order.total.toLocaleString('es-AR')}\n\n` +
          `📲 WhatsApp de contacto: ${PHONE_NUMBER}`;
        
        window.open(`https://wa.me/549${PHONE_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
      };

      return (
        <div className="bg-slate-50 min-h-screen flex flex-col font-sans max-w-md mx-auto relative overflow-hidden text-slate-900 select-none pb-24">
          
          {/* Header */}
          <header className="bg-blue-600 text-white px-6 pt-8 pb-6 sticky top-0 z-40 rounded-b-[2.5rem] shadow-lg">
            <div className="flex justify-between items-center">
              <div>
                <h1 className="text-2xl font-black tracking-tight flex items-center gap-2">
                  SANTOLAYA <span className="bg-white text-blue-600 px-2 py-0.5 rounded-lg text-[10px] tracking-widest font-black">PRO</span>
                </h1>
                <p className="text-[10px] font-bold text-blue-100 uppercase tracking-widest mt-1">Preventa & Distribución</p>
              </div>
              <div className="bg-blue-500/50 p-2.5 rounded-2xl backdrop-blur-md border border-white/20">
                <i data-lucide="truck" class="w-6 h-6 text-white"></i>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 p-5 overflow-y-auto">
            
            {/* Catalog Tab */}
            {activeTab === 'catalog' && (
              <div className="space-y-4">
                <div className="relative">
                  <input 
                    type="text" 
                    placeholder="Buscar productos..." 
                    className="w-full bg-white p-4 pl-12 rounded-2xl shadow-sm border border-slate-100 outline-none font-bold text-sm focus:border-blue-500 transition-all"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                  />
                  <i data-lucide="search" class="absolute left-4 top-4 text-slate-300 w-5 h-5"></i>
                </div>

                {selectedCustomer && (
                  <div className="bg-blue-50 border border-blue-200 text-blue-900 p-4 rounded-2xl flex justify-between items-center shadow-sm">
                    <div>
                      <p className="text-[9px] font-black uppercase text-blue-500 tracking-widest">Cliente Seleccionado:</p>
                      <p className="font-black text-sm">{selectedCustomer.name}</p>
                    </div>
                    <button onClick={() => setActiveTab('customers')} className="bg-white p-2 rounded-xl shadow-sm text-blue-600">
                      <i data-lucide="edit-2" class="w-4 h-4"></i>
                    </button>
                  </div>
                )}

                <div className="grid grid-cols-1 gap-3">
                  {products.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase())).map(p => {
                    const qty = cart.find(i => i.product.id === p.id)?.quantity || 0;
                    
                    return (
                      <div key={p.id} className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
                        <div className="flex-1 pr-2">
                          <span className="text-[8px] font-black bg-slate-100 text-slate-400 px-2 py-0.5 rounded-full uppercase">{p.category}</span>
                          <h3 className="font-bold text-slate-800 text-sm leading-tight mt-1 mb-1">{p.name}</h3>
                          <p className="text-blue-600 font-black text-lg tracking-tight">${p.price.toLocaleString('es-AR')}</p>
                        </div>
                        
                        <div className="flex items-center bg-slate-50 rounded-2xl p-1 border border-slate-100">
                          <button onClick={() => updateQuantity(p, -1)} className={`w-9 h-9 flex items-center justify-center rounded-xl transition-all ${qty > 0 ? 'bg-white text-red-500 shadow-sm' : 'text-slate-300'}`}>
                            <i data-lucide="minus" class="w-4 h-4"></i>
                          </button>
                          <span className="w-8 text-center font-black text-slate-800 text-base">{qty}</span>
                          <button onClick={() => updateQuantity(p, 1)} className="w-9 h-9 flex items-center justify-center rounded-xl bg-blue-600 text-white shadow-md active:scale-95 transition-all">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Cart Tab */}
            {activeTab === 'cart' && (
              <div className="space-y-4">
                {cart.length === 0 ? (
                  <div className="text-center py-24 opacity-30 flex flex-col items-center">
                    <i data-lucide="shopping-cart" class="w-20 h-20 mb-4"></i>
                    <p className="font-black text-xs uppercase tracking-widest">Carrito sin productos</p>
                  </div>
                ) : (
                  <>
                    <div className="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100">
                      <div className="p-4 border-b text-[10px] font-black text-slate-400 uppercase tracking-widest bg-slate-50/50">Resumen del Pedido</div>
                      <div className="max-h-[40vh] overflow-y-auto">
                        {cart.map(i => (
                          <div key={i.product.id} className="p-4 flex justify-between items-center border-b border-slate-50">
                            <div>
                              <p className="font-bold text-sm text-slate-800">{i.product.name}</p>
                              <p className="text-[10px] font-bold text-slate-400 mt-0.5">{i.quantity} x ${i.product.price.toLocaleString()}</p>
                            </div>
                            <p className="font-black text-base text-slate-900">${(i.quantity * i.product.price).toLocaleString('es-AR')}</p>
                          </div>
                        ))}
                      </div>
                      <div className="p-6 flex justify-between items-end bg-blue-50/40">
                        <span className="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1">Total Preventa</span>
                        <span className="text-3xl font-black text-blue-600 tracking-tight">${cartTotal.toLocaleString('es-AR')}</span>
                      </div>
                    </div>

                    <button 
                      onClick={() => {
                        const newOrder = { 
                          id: Date.now(), 
                          customer: selectedCustomer, 
                          total: cartTotal, 
                          date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), 
                          items: [...cart] 
                        };
                        setOrders([newOrder, ...orders]);
                        setCart([]);
                        setActiveTab('orders');
                      }}
                      disabled={!selectedCustomer}
                      className={`w-full py-5 rounded-2xl font-black text-lg shadow-xl transition-all uppercase tracking-wider ${
                        selectedCustomer 
                          ? 'bg-blue-600 text-white shadow-blue-200 active:scale-95' 
                          : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                      }`}
                    >
                      {selectedCustomer ? 'Guardar Nota de Venta' : 'Selecciona un Cliente'}
                    </button>
                  </>
                )}
              </div>
            )}

            {/* Orders Tab */}
            {activeTab === 'orders' && (
              <div className="space-y-4">
                <h2 className="text-xl font-black text-slate-800 px-1 tracking-tight">Notas de Venta</h2>
                {orders.length === 0 ? (
                  <p className="text-xs text-slate-400 font-bold text-center py-10">No hay ventas registradas hoy.</p>
                ) : (
                  orders.map(o => (
                    <div key={o.id} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                      <div className="flex justify-between items-start">
                        <div>
                          <h3 className="font-black text-lg text-slate-800">{o.customer?.name || "Venta Directa"}</h3>
                          <p className="text-[10px] font-bold text-slate-400 uppercase">{o.date}</p>
                        </div>
                        <p className="text-xl font-black text-emerald-600">${o.total.toLocaleString('es-AR')}</p>
                      </div>
                      <button 
                        onClick={() => sendWhatsAppOrder(o)}
                        className="w-full py-3.5 bg-emerald-500 text-white rounded-xl font-black text-xs tracking-widest uppercase flex items-center justify-center gap-2 shadow-md shadow-emerald-100 active:scale-95 transition-all"
                      >
                        <i data-lucide="message-square" class="w-4 h-4"></i> Enviar por WhatsApp
                      </button>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* Customers Tab */}
            {activeTab === 'customers' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center px-1">
                  <h2 className="text-xl font-black text-slate-800 tracking-tight">Cartera de Clientes</h2>
                </div>
                {customers.map(c => (
                  <div 
                    key={c.id} 
                    onClick={() => { setSelectedCustomer(c); setActiveTab('catalog'); }}
                    className={`p-5 rounded-3xl border-2 transition-all cursor-pointer flex justify-between items-center ${
                      selectedCustomer?.id === c.id 
                        ? 'border-blue-500 bg-blue-50/30 shadow-md' 
                        : 'border-white bg-white shadow-sm'
                    }`}
                  >
                    <div>
                      <p className="font-black text-slate-800 text-base">{c.name}</p>
                      <p className="text-xs text-slate-400 font-bold flex items-center gap-1 mt-0.5">
                        <i data-lucide="map-pin" class="w-3 h-3"></i> {c.address}
                      </p>
                    </div>
                    {selectedCustomer?.id === c.id && (
                      <div className="bg-blue-600 p-2 rounded-full text-white">
                        <i data-lucide="check" class="w-4 h-4"></i>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Navigation Bar */}
          <nav className="bg-white border-t border-slate-100 fixed bottom-0 w-full max-w-md z-50 rounded-t-3xl shadow-[0_-10px_25px_rgba(0,0,0,0.05)]">
            <div className="flex justify-around items-center h-20 px-4">
              {[
                { id: 'catalog', icon: 'package', label: 'Stock' },
                { id: 'cart', icon: 'shopping-cart', label: 'Pedido' },
                { id: 'customers', icon: 'users', label: 'Clientes' },
                { id: 'orders', icon: 'clipboard-list', label: 'Notas' }
              ].map(tab => (
                <button 
                  key={tab.id} 
                  onClick={() => setActiveTab(tab.id)} 
                  className={`flex flex-col items-center justify-center flex-1 transition-all ${
                    activeTab === tab.id ? 'text-blue-600 scale-105' : 'text-slate-300'
                  }`}
                >
                  <i data-lucide={tab.icon} class="w-6 h-6"></i>
                  <span className="text-[9px] font-black tracking-wider mt-1 uppercase">{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
